<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker | Minimal</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <header>
            <p class="label">ОБЩИЕ РАСХОДЫ</p>
            <h1 id="totalAmount">0 ₽</h1>
        </header>

        <div class="input-group">
            <input type="text" id="expenseName" placeholder="НАЗВАНИЕ" autocomplete="off">
            
            <select id="expenseCategory">
                <option value="ПРОДУКТЫ">ЕДА</option>
                <option value="ТРАНСПОРТ">ТРАНСПОРТ</option>
                <option value="ХОББИ">ХОББИ</option>
                <option value="ДОМ">ДОМ</option>
                <option value="ДРУГОЕ">ДРУГОЕ</option>
            </select>

            <div class="price-calc">
                <input type="number" id="expenseCount" placeholder="КОЛ-ВО" value="1">
                <input type="number" id="expensePrice" placeholder="ЦЕНА ЗА ЕД.">
            </div>
            
            <button id="addBtn">ДОБАВИТЬ</button>
        </div>

        <ul id="expenseList" class="expense-list"></ul>
        
        <button id="clearAll" class="clear-btn">ОЧИСТИТЬ ВСЁ</button>
    </div>
    <script src="./main.js"></script>
</body>
</html>
