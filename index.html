<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finance Tracker | Minimal</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <header>
            <p class="label">ОБЩИЕ РАСХОДЫ</p>
            <h1 id="totalAmount">0 ₽</h1>
        </header>

        <div class="input-group">
            <input type="text" id="expenseName" placeholder="НАЗВАНИЕ ТРАТЫ" autocomplete="off">
            
            <select id="expenseCategory">
                <option value="ПРОДУКТЫ">ЕДА / ПРОДУКТЫ</option>
                <option value="ТРАНСПОРТ">ТРАНСПОРТ</option>
                <option value="ХОББИ">ХОББИ / ОТДЫХ</option>
                <option value="ДОМ">ДОМ / БЫТ</option>
                <option value="ДРУГОЕ">ДРУГОЕ</option>
            </select>

            <div class="price-calc">
                <input type="number" id="expenseCount" placeholder="КОЛ-ВО" value="1">
                <input type="number" id="expensePrice" placeholder="ЦЕНА ЗА ЕД.">
            </div>
            
            <button id="addBtn">ДОБАВИТЬ В СПИСОК</button>
        </div>

        <div id="expenseList" class="expense-list"></div>
        
        <button id="clearAll" class="clear-btn">ОЧИСТИТЬ ВСЮ ИСТОРИЮ</button>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content">
            <p>УДАЛИТЬ ВСЮ ИСТОРИЮ ТРАТ?</p>
            <div class="modal-buttons">
                <button id="confirmCancel">ОТМЕНА</button>
                <button id="confirmDelete" class="danger">УДАЛИТЬ</button>
            </div>
        </div>
    </div>

    <script src="./main.js"></script>
</body>
</html>
